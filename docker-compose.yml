version: "3.9"  # Docker-compose 버전

services:
  frontend:
    image: ghcr.io/bandeutseolap/bandeutseolap/frontend:latest
    container_name: bandeutseolap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks: [mynet]

  backend:
    image: ghcr.io/bandeutseolap/bandeutseolap/backend:latest
    container_name: bandeutseolap-backend
    ports:
      - "8080:8080"
    env_file:
      - ./.backend.env
    environment:
          - JAVA_TOOL_OPTIONS=-Dfile.encoding=UTF-8
    restart: unless-stopped
    networks: [mynet]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /data/redis:/data
      - /logs/redis:/var/log/redis
    restart: unless-stopped
    networks: [ mynet ]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"        # 호스트(스프링부트 앱)에서 접근
      - "9093:9093"        # 컨트롤러 내부 통신
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # 로컬 단일 브로커이므로 replication factor는 1로 고정 (운영에선 3 이상)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # 고정값

    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mynet:
